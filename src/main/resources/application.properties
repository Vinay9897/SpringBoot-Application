# application.properties is the Spring Boot external configuration file.
# It stores runtime settings such as datasource configuration and feature toggles.

spring.application.name=demo

# H2 in-memory datasource configuration for demo and development.
# jdbc:h2:mem:demo creates an in-memory database named demo.
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate settings for the H2 database.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable the H2 console for browser access at /h2-console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
